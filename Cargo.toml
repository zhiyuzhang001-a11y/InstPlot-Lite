[workspace]
members = [
    ".",
    "crates/instplot-core",
    "crates/instplot-fitting",
    "crates/instplot-io",
    "crates/instplot-processing",
]
resolver = "3"

[package]
name = "instplot-lite"
version = "0.3.7"
edition = "2024"
description = "A lightweight native data plotting and point-editing tool"
license = "MIT"

[features]
default = []
# Enables the isolated Windows updater harness used by GitHub Actions. Release
# packages are built without this feature and cannot override trusted endpoints.
updater-e2e = []

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.37.0"
instplot-core = { path = "crates/instplot-core" }
instplot-fitting = { path = "crates/instplot-fitting" }
instplot-io = { path = "crates/instplot-io" }
instplot-processing = { path = "crates/instplot-processing" }
png = "0.18.0"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
ed25519-dalek = "3.0.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip", "win-system-proxy"] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
