name: InstPlot Lite

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "assets/**"
      - "packaging/**"
      - "tests/**"
      - "InP_logo.png"
      - "logo.ico"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".gitattributes"
      - ".github/workflows/instplot-lite.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "assets/**"
      - "packaging/**"
      - "tests/**"
      - "InP_logo.png"
      - "logo.ico"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".gitattributes"
      - ".github/workflows/instplot-lite.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check release importer
        if: runner.os != 'Windows'
        run: target/release/instplot-lite --check tests/fixtures/smoke.csv

      - name: Check Windows release importer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process target/release/instplot-lite.exe -Wait -PassThru -ArgumentList "--check", "tests/fixtures/smoke.csv"
          if ($process.ExitCode -ne 0) { throw "Release importer check failed" }

  package-macos:
    name: Package macOS (arm64)
    timeout-minutes: 35
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Build and verify DMG
        env:
          INSTPLOT_SKIP_BUILD: "1"
        run: packaging/macos/build-dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: InstPlot-Lite-macos-arm64
          path: target/package/*.dmg
          if-no-files-found: error

  package-windows:
    name: Package Windows (x64)
    timeout-minutes: 35
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Read package version
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw "Unable to read package version" }
          "INSTPLOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch pinned Simplified Chinese installer translation
        run: |
          $translation = "packaging/windows/ChineseSimplified.isl"
          $uri = "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/1ff90acc4ed4aee82b1cda43253243deee3daed4/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $uri -OutFile $translation
          $actual = (Get-FileHash -Algorithm SHA256 $translation).Hash.ToLowerInvariant()
          $expected = "bf0751fa176569c6faa2f6e17ed2734617bef325d5cc06eae030fdd0258ee778"
          if ($actual -ne $expected) { throw "Chinese installer translation checksum mismatch" }

      - name: Build Inno Setup installer
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc packaging/windows/InstPlotLite.iss

      - name: Silent-install smoke test
        run: |
          $setup = Get-ChildItem target/package/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer was not created" }
          $installDir = Join-Path $env:RUNNER_TEMP "InstPlotLiteSmoke"
          $process = Start-Process $setup.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          @("LICENSE.txt", "THIRD_PARTY_NOTICES.md", "OFL-Liberation.txt", "OFL-Noto-Sans-SC.txt") | ForEach-Object {
            $licensePath = Join-Path $installDir "licenses\$_"
            if (-not (Test-Path $licensePath)) { throw "Installed license file missing: $licensePath" }
          }
          $process = Start-Process "$installDir\instplot-lite.exe" -Wait -PassThru -ArgumentList "--check", "tests/fixtures/smoke.csv"
          if ($process.ExitCode -ne 0) { throw "Installed executable smoke check failed" }

          # Exercise the same silent replacement flags used by the in-app updater.
          $runningApp = Start-Process "$installDir\instplot-lite.exe" -PassThru
          Start-Sleep -Seconds 2
          $process = Start-Process $setup.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/RESTARTAPPLICATIONS", "/SP-", "/DIR=$installDir"
          if ($process.ExitCode -ne 0) { throw "Update-style reinstall exited with $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (-not $runningApp.HasExited) { throw "Update-style reinstall did not close the running app" }
          Get-Process -Name "instplot-lite" -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$installDir\instplot-lite.exe" } | Stop-Process -Force
          $process = Start-Process "$installDir\instplot-lite.exe" -Wait -PassThru -ArgumentList "--check", "tests/fixtures/smoke.csv"
          if ($process.ExitCode -ne 0) { throw "Updated executable smoke check failed" }

          $uninstaller = Join-Path $installDir "unins000.exe"
          $process = Start-Process $uninstaller -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }

      - name: In-app updater end-to-end test
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem target/package/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Candidate installer was not created" }

          $testRoot = Join-Path $env:RUNNER_TEMP "InstPlotUpdaterE2E"
          $serverRoot = Join-Path $testRoot "server"
          $candidateSetup = Join-Path $testRoot $setup.Name
          $candidateExe = Join-Path $testRoot "candidate-instplot-lite.exe"
          $installDir = Join-Path $testRoot "installed"
          $statusPath = Join-Path $testRoot "status.txt"
          New-Item -ItemType Directory -Force $serverRoot | Out-Null
          Copy-Item $setup.FullName $candidateSetup
          Copy-Item target/release/instplot-lite.exe $candidateExe

          $releaseDir = Join-Path $serverRoot "releases\$env:INSTPLOT_VERSION"
          $signatureDir = Join-Path $serverRoot "stable\signatures"
          New-Item -ItemType Directory -Force $releaseDir, $signatureDir | Out-Null
          $servedSetup = Join-Path $releaseDir $setup.Name
          Copy-Item $candidateSetup $servedSetup

          $privateKey = Join-Path $testRoot "update-private.pem"
          $publicDer = Join-Path $testRoot "update-public.der"
          & openssl genpkey -algorithm ED25519 -out $privateKey
          if ($LASTEXITCODE -ne 0) { throw "Unable to generate updater test key" }
          & openssl pkey -in $privateKey -pubout -outform DER -out $publicDer
          if ($LASTEXITCODE -ne 0) { throw "Unable to export updater test public key" }
          $der = [IO.File]::ReadAllBytes($publicDer)
          $publicHex = -join ($der[($der.Length - 32)..($der.Length - 1)] | ForEach-Object { $_.ToString("x2") })

          $port = 18765
          $baseUrl = "http://127.0.0.1:$port"
          $manifestPath = Join-Path $serverRoot "stable\latest.json"
          $signaturePath = Join-Path $signatureDir "$env:INSTPLOT_VERSION.sig"
          $manifest = [ordered]@{
            schema = 1
            version = $env:INSTPLOT_VERSION
            published_at = "2099-01-01"
            notes = "Automated Windows updater end-to-end test"
            installer_url = "$baseUrl/releases/$env:INSTPLOT_VERSION/$($setup.Name)"
            signature_url = "$baseUrl/stable/signatures/$env:INSTPLOT_VERSION.sig"
            sha256 = (Get-FileHash -Algorithm SHA256 $servedSetup).Hash.ToLowerInvariant()
            size_bytes = [int64](Get-Item $servedSetup).Length
          }
          $json = $manifest | ConvertTo-Json
          [IO.File]::WriteAllText($manifestPath, "$json`n", [Text.UTF8Encoding]::new($false))
          & openssl pkeyutl -sign -rawin -inkey $privateKey -in $manifestPath -out $signaturePath
          if ($LASTEXITCODE -ne 0) { throw "Unable to sign updater test manifest" }

          # Build an installed "old" client with the isolated E2E entrypoint.
          # Production packages never enable this feature or accept endpoint overrides.
          cargo build --release --locked --features updater-e2e
          $oldHash = (Get-FileHash -Algorithm SHA256 target/release/instplot-lite.exe).Hash
          $candidateHash = (Get-FileHash -Algorithm SHA256 $candidateExe).Hash
          if ($oldHash -eq $candidateHash) { throw "Old and candidate executables must differ" }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/windows/InstPlotLite.iss
          if ($LASTEXITCODE -ne 0) { throw "Unable to build updater test installer" }
          $oldSetup = Get-ChildItem target/package/*-setup.exe | Select-Object -First 1
          $process = Start-Process $oldSetup.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          if ($process.ExitCode -ne 0) { throw "Old test installer exited with $($process.ExitCode)" }

          # Keep the verified candidate as the job artifact after the test build overwrote it.
          Copy-Item $candidateSetup $setup.FullName -Force
          $server = Start-Process python -PassThru -WindowStyle Hidden -ArgumentList "-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", $serverRoot
          try {
            $ready = $false
            1..30 | ForEach-Object {
              if (-not $ready) {
                try {
                  Invoke-WebRequest -UseBasicParsing "$baseUrl/stable/latest.json" | Out-Null
                  $ready = $true
                } catch {
                  Start-Sleep -Milliseconds 500
                }
              }
            }
            if (-not $ready) { throw "Local updater test server did not start" }

            $env:INSTPLOT_UPDATER_E2E_MANIFEST_URL = "$baseUrl/stable/latest.json"
            $env:INSTPLOT_UPDATER_E2E_RELEASE_PREFIX = "$baseUrl/releases/"
            $env:INSTPLOT_UPDATER_E2E_SIGNATURE_PREFIX = "$baseUrl/stable/signatures/"
            $env:INSTPLOT_UPDATER_E2E_PUBLIC_KEY = $publicHex
            $env:INSTPLOT_UPDATER_E2E_CURRENT_VERSION = "0.0.0"
            $installedExe = Join-Path $installDir "instplot-lite.exe"
            $process = Start-Process $installedExe -Wait -PassThru -ArgumentList "--updater-e2e", $statusPath
            if ($process.ExitCode -ne 0) {
              $details = if (Test-Path $statusPath) { Get-Content $statusPath -Raw } else { "No status file" }
              throw "Updater client exited with $($process.ExitCode): $details"
            }
            if ((Get-Content $statusPath -Raw) -notmatch "download-verified") {
              throw "Updater did not report a verified download"
            }

            $updated = $false
            1..120 | ForEach-Object {
              if (-not $updated -and (Test-Path $installedExe)) {
                try {
                  $updated = (Get-FileHash -Algorithm SHA256 $installedExe).Hash -eq $candidateHash
                } catch {}
              }
              if (-not $updated) { Start-Sleep -Seconds 1 }
            }
            if (-not $updated) { throw "In-app updater did not install the candidate executable" }
            $process = Start-Process $installedExe -Wait -PassThru -ArgumentList "--check", "tests/fixtures/smoke.csv"
            if ($process.ExitCode -ne 0) { throw "Updated executable smoke check failed" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            Get-Process -Name "instplot-lite" -ErrorAction SilentlyContinue | Stop-Process -Force
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) {
              Start-Process $uninstaller -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            }
            Copy-Item $candidateSetup $setup.FullName -Force
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: InstPlot-Lite-windows-x64
          path: target/package/*-setup.exe
          if-no-files-found: error

  package-linux:
    name: Package Linux (x64)
    timeout-minutes: 35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Build DEB and portable archive
        env:
          INSTPLOT_SKIP_BUILD: "1"
        run: packaging/linux/build-packages.sh

      - name: Install and verify DEB
        run: |
          sudo apt-get install -y ./target/package/*.deb
          test -f /usr/share/doc/instplot-lite/copyright
          test -f /usr/share/doc/instplot-lite/THIRD_PARTY_NOTICES.md
          test -f /usr/share/doc/instplot-lite/licenses/OFL-Liberation.txt
          test -f /usr/share/doc/instplot-lite/licenses/OFL-Noto-Sans-SC.txt
          /usr/bin/instplot-lite --check tests/fixtures/smoke.csv
          tar -tzf ./target/package/*.tar.gz | grep -q '/licenses/LICENSE.txt$'
          tar -tzf ./target/package/*.tar.gz | grep -q '/licenses/THIRD_PARTY_NOTICES.md$'
          tar -tzf ./target/package/*.tar.gz | grep -q '/licenses/OFL-Liberation.txt$'
          tar -tzf ./target/package/*.tar.gz | grep -q '/licenses/OFL-Noto-Sans-SC.txt$'
          sudo apt-get remove -y instplot-lite

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: InstPlot-Lite-linux-x64
          path: |
            target/package/*.deb
            target/package/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, package-macos, package-windows, package-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo package version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          pattern: InstPlot-Lite-*
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -- ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" ./* \
            --title "InstPlot Lite ${GITHUB_REF_NAME}" \
            --notes-file ../docs/RELEASE_NOTES_v0.3.3.md \
            --prerelease
