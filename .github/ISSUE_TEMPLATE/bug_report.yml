name: 软件问题
description: InstPlot Lite 无法安装、打开、导入、绘图或导出时，请使用此模板
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传包含敏感实验信息的原始数据；如需提供样本，请先脱敏并尽量缩小文件。
  - type: dropdown
    id: system
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS（Apple 芯片）
        - macOS（Intel 芯片）
        - Ubuntu / Debian Linux
        - 其他 Linux
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: 下载的安装包文件名
      placeholder: 例如 InstPlot-Lite-0.3.0-windows-x64-setup.exe
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 出现问题前做了什么？
      description: 请按顺序写出可以重复问题的操作。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果和错误文字
      description: 可以直接拖入截图；请同时复制能看到的错误文字。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 可公开的最小数据样本（可选）
      description: 仅在确认不含敏感信息后上传。
